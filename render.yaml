services:
  # PostgreSQL database
  - type: pgsql
    name: baserow-db
    ipAllowList: []  # Adjust as needed
    plan: starter

  # Redis cache/queue
  - type: redis
    name: baserow-redis
    plan: starter

  # Baserow web app (all-in-one Docker image)
  - type: web
    name: baserow
    env: docker
    dockerfilePath: ./docker/Dockerfile
    repo: https://github.com/baserow/baserow
    plan: starter  # Scale to pro/standard as needed
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: baserow-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: baserow-redis
          property: connectionString
      - key: BASEROW_PUBLIC_URL
        value: https://your-app.onrender.com  # Replace with your Render domain
      - key: EMAIL_HOST
        value: smtp.example.com  # Configure your SMTP
      - key: NEXT_PUBLIC_BASEROW_PUBLIC_URL
        value: https://your-app.onrender.com
      # Add more from Baserow's .env.example (e.g., SECRET_KEY_BASE)

    healthCheckPath: /api/ping/
    autoDeploy: true

