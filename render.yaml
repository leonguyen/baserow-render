services:
  # PostgreSQL (managed by Render)
  - type: pgsql
    name: baserow-db
    ipAllowList: []  # Optional: restrict IPs

  # Redis
  - type: redis
    name: baserow-redis
    ipAllowList: []

  # Baserow (using official all-in-one Docker image)
  - type: web
    name: baserow
    env: docker
    image: baserow/baserow:latest  # Official image, no Dockerfile needed
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: baserow-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: baserow-redis
          property: connectionString
      - key: BASEROW_PUBLIC_URL
        value: https://your-app-name.onrender.com  # Your Render domain
      - key: EMAIL_HOST
        value: smtp.gmail.com  # Configure SMTP (optional for emails)
      - key: EMAIL_HOST_USER
        generateValue: true
      - key: EMAIL_HOST_PASSWORD
        generateValue: true
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: NEXTAUTH_SECRET
        generateValue: true
    healthCheckPath: /api/ping/
    handles:
      - method: POST
        path: /_matrix
      - method: GET
        path: /api
    autoDeploy: true

